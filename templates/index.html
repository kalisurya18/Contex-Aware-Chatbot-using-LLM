<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBot - Educational Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        .chat-container { height: calc(100vh - 200px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-4xl mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-3xl font-bold text-indigo-600">EduBot 🎓</h1>
            <p class="text-slate-500 text-sm">Context-Aware Educational Assistant</p>
        </header>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden flex flex-col">
            <div id="chat-window" class="chat-container overflow-y-auto p-6 space-y-4">
                <div class="flex justify-start">
                    <div class="bg-indigo-100 text-indigo-800 p-3 rounded-lg max-w-[80%]">
                        Hello! How can I help you with your academic queries today?
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <div class="flex gap-2">
                    <input type="text" id="user-input" placeholder="Type your question here..." 
                        class="flex-1 p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `${role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-800'} p-3 rounded-lg max-w-[80%]`;
            msgDiv.innerText = text;
            
            div.appendChild(msgDiv);
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, conversation_id: null })
                });
                const data = await response.json();
                appendMessage('assistant', data.response);
            } catch (error) {
                appendMessage('assistant', 'Error: Could not connect to server.');
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
